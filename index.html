<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <title>Rock, Paper, Scissors, Lizard, Spock</title>
 
<body>
  <section class="game-bar">
    <div class="container-md info">
      <header class="game-header">
          <div class="row align-items-center">
            <div class="col">
              <h3 class="game-title">
                ROCK<br>
                PAPER<br>
                SCISSORS<br>
                LIZARD<br>
                SPOCK
              </h3>
            </div>
            <div class="col-auto">
              <div class="card text-center scoreboard">
                <div class="card-body">
                  <span>Score</span>
                  <strong id="score">0</strong>
                </div>
              </div>
            </div>
      </header>
    </div>
  </section>

  <section class="play-area ">
    <div class="container game-board position-relative" id="game-board">

      <img src="./images/bg-pentagon.svg" class="pentagon">
      <!--game buttons-->
      <button class="btn rounded-circle btn-outline-secondary rock choice" id="rock">
        <img src="./images/icon-rock.svg" alt="rock">
      </button>

      <button class="btn rounded-circle btn-outline-secondary paper choice" id="paper">
        <img src="./images/icon-paper.svg" alt="paper">
      </button>

      <button class="btn rounded-circle btn-outline-secondary scissors choice" id="scissors">
        <img src="./images/icon-scissors.svg" alt="scissors">
      </button>

      <button class="btn rounded-circle btn-outline-secondary lizard choice" id="lizard">
        <img src="./images/icon-lizard.svg" alt="lizard">
      </button>

      <button class="btn rounded-circle btn-outline-secondary spock choice" id="spock">
        <img src="./images/icon-spock.svg" alt="spock">
      </button>
    </div>
  </section>

  <section class="rules-section text-end p-3">
      <button 
        type="button"
        class="btn btn-outline-light rules-btn"
        data-bs-toggle="modal"
        data-bs-target="#rulesModal"
      >
      RULES</button>
    </div>
  </section>

  <div class="modal dade" id="rulesModal" tabinex="-1" arias-labelledy="rulesModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-white p-4 rounded-4">
      <div class="modal-header border-0 pb-0 d-flex justify-content-between align-items-center">
        <h2 class="modal-title fw-bold text-dark fs-3 m-0" id="rulesModalLabel">RULES</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center pt-4">
        <img src="./images/image-rules-bonus.svg" alt="Rules" class="img-fluid">
      </div>
    </div>
  </div>
  </div>

  <section id="1v1">
    <div id="results" class="results d-none">
      <div class="row align-items-center text-center">

        <div class="col player" id="player">
          <h2>YOU PICKED</h2>
          <div id="user-choice" class="result-choice">
          </div>
        </div>

        <div class="col result-message">
          <h2 id="winner-text">YOU WIN</h2>
          <button class="btn btn-outline-secondary" onclick="resetGame()">
            PLAY AGAIN
          </button>
        </div>

        <div class="col player">
          <h2> THE HOUSE PICKED</h2>
          <div id="computer-choice" class="result-choice">
          </div>
        </div>

      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/script.js"></script>
</body>
</html>
